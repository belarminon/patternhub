
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: patternhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build: ./patternhub-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: patternhub
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./patternhub-frontend
      dockerfile: Dockerfile.prod
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db-data:
